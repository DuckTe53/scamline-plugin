# Başlamak için gereken en az oyuncu. Test için 1, gerçek oyun için 2 yap.
min-players: 1

# Odalar ve koridor "/scamline kurulum" komutuyla otomatik oluşturulur ve bu alanlar dolar.
rooms: []

corridor: ""

# Oda merkezine göre çerçeve konumları (x,y,z). Kuzey duvarına (oda içine bakan) yerleşir.
frames:
  share-offset: "-1,1.5,-2"
  steal-offset: "1,1.5,-2"

skins:
  default: ItzSilentEchoz
  clown: im_a_lauver0
  frog: MaoZedong67

# SkinsRestorer komutu. {skin} ve {player} otomatik doldurulur.
skin-command: "skin set {skin} {player}"

share-reshuffle-minutes: 3
scoreboard-rotate-seconds: 25
